name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Submit sitemap URLs to IndexNow
        env:
          SITE: https://taxcal.siddheshthapa.com
          HOST: taxcal.siddheshthapa.com
        run: |
          python3 - <<'PY'
          import glob, json, os, re, sys, time, urllib.request, urllib.error
          import xml.etree.ElementTree as ET

          site, host = os.environ["SITE"], os.environ["HOST"]

          # Reuse the key file already committed at the repo root: a file named
          # <key>.txt whose content is exactly <key>.
          keys = []
          for path in glob.glob("*.txt"):
              name = os.path.basename(path)[:-4]
              if re.fullmatch(r"[A-Za-z0-9-]{8,128}", name):
                  with open(path, encoding="utf-8") as f:
                      if f.read().strip() == name:
                          keys.append(name)
          if len(keys) != 1:
              sys.exit(f"ERROR: expected exactly one IndexNow key file at repo root, found {len(keys)}: {keys}")
          key = keys[0]
          print(f"Key file: {key}.txt")

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "taxcal-indexnow-action", "Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          # Pages deploys after the push, so wait until the live sitemap matches
          # the committed one before submitting. Falls back to the live copy.
          norm = lambda b: b.replace(b"\r\n", b"\n").strip()
          with open("sitemap.xml", "rb") as f:
              committed = norm(f.read())
          live = None
          for attempt in range(1, 21):
              try:
                  live = norm(get(f"{site}/sitemap.xml?cb={int(time.time())}"))
                  if live == committed:
                      print(f"Live sitemap matches the commit (attempt {attempt}).")
                      break
                  print(f"Attempt {attempt}: live sitemap not yet updated; waiting 30s.")
              except Exception as e:
                  print(f"Attempt {attempt}: could not fetch sitemap ({e}); waiting 30s.")
              time.sleep(30)
          else:
              if live is None:
                  sys.exit("ERROR: sitemap could not be fetched from the live site.")
              print("WARNING: live sitemap still differs from the commit after 10 minutes; submitting the live copy.")

          try:
              root = ET.fromstring(live)
          except ET.ParseError as e:
              sys.exit(f"ERROR: sitemap is not valid XML: {e}")
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [el.text.strip() for el in root.findall(".//sm:loc", ns) if el.text and el.text.strip()]
          print(f"URLs discovered: {len(urls)}")
          for u in urls:
              print(f"  {u}")
          if not urls:
              sys.exit("ERROR: no <loc> URLs found in sitemap.")

          payload = json.dumps({
              "host": host,
              "key": key,
              "keyLocation": f"{site}/{key}.txt",
              "urlList": urls,
          }).encode("utf-8")
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              method="POST",
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  status, body = r.status, r.read().decode("utf-8", "replace")
          except urllib.error.HTTPError as e:
              status, body = e.code, e.read().decode("utf-8", "replace")
          except Exception as e:
              sys.exit(f"ERROR: IndexNow request failed: {e}")

          print(f"IndexNow HTTP status: {status}")
          print(f"IndexNow response body: {body or '(empty)'}")
          if status not in (200, 202):
              sys.exit(f"ERROR: IndexNow returned HTTP {status}.")
          PY
