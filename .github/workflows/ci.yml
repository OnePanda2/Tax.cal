name: CI

# Runs the full test suite on every push and pull request: engine golden
# values, India, validation, the MCP server, the plugin package and the
# generated-file freshness checks. No secrets are used.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
